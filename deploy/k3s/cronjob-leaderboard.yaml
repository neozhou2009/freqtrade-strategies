apiVersion: batch/v1
kind: CronJob
metadata:
  name: leaderboard-auto-updater
  namespace: quantrading
spec:
  # 温哥华时间每天 12:20 执行（测试用，之后改为正式时间）
  schedule: "20 12 * * *"
  timeZone: "America/Vancouver"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # 给数据下载 + 回测足够时间
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      template:
        spec:
          initContainers:
          # Step 1: 同步最新代码
          - name: sync-code
            image: alpine/git
            command: ["/bin/sh", "-c"]
            args:
            - |
              cd /workdir
              if [ ! -d .git ]; then
                git clone --single-branch --branch commercial --depth 1 https://github.com/neozhou2009/freqtrade-strategies.git .
              else
                git fetch origin commercial
                git reset --hard FETCH_HEAD
              fi
              
              # Flatten strategies into /workdir/user_data/strategies so pipeline can find them
              mkdir -p /workdir/user_data/strategies
              find /workdir/strategies -name "*.py" -exec cp {} /workdir/user_data/strategies/ \;
            volumeMounts:
            - name: strategy-storage
              mountPath: /workdir
          # Step 3: 运行回测流水线
          containers:
          - name: updater
            image: neozhou2009/freqtrade-full:latest
            imagePullPolicy: IfNotPresent
            workingDir: /workdir
            resources:
              requests:
                cpu: "1000m"
                memory: "2Gi"
              limits:
                cpu: "2000m"
                memory: "4Gi"
            command: ["/bin/bash", "-c"]
            args:
            - |
              # 注意：建议将 psycopg2-binary 构建进 Docker 镜像中以提高稳定性
              pip install --no-cache-dir psycopg2-binary
              bash scripts/auto_update_all_periods.sh --all --mode fast
            env:
              - name: POSTGRES_USER
                value: "quantrading"
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: quantrading-secrets
                    key: POSTGRES_PASSWORD
              - name: K3S_PG_SVC
                value: "mx-postgres-ha-postgresql-ha-pgpool.infra.svc.cluster.local"
            volumeMounts:
            - name: strategy-storage
              mountPath: /workdir
          restartPolicy: OnFailure
          volumes:
          - name: strategy-storage
            persistentVolumeClaim:
              claimName: strategy-pvc

