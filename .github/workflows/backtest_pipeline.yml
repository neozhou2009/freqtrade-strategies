name: Freqtrade CI/CD Backtesting Pipeline

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Timerange period for backtesting'
        required: true
        default: 'last_1_month'
        type: choice
        options:
          - last_1_month
          - last_3_months
          - 2025_year
      strategy:
        description: 'Optional: run only one strategy name from strategy_registry'
        required: false
        default: ''
        type: string

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # ====================================================================================================
      # 【日常跑全量】
      # 留空 DEFAULT_STRATEGY 表示自动触发（push/schedule）时跑全量 465 个策略： DEFAULT_STRATEGY: ''
      #
      # 【排查某个出错策略的 2 种方法】
      # 方法 1 (推荐): 在 GitHub 网页点击 Actions -> 此流水线 -> 选 "Run workflow"，在弹出的 strategy
      #               输入框直接填入出错的策略名 (如 ADXMomentum)。该方法无需改代码，测完依然全量。
      # 方法 2 (修改代码): 若需要一段时间内每次 Git Push 都只跑某个问题策略，
      #               直接将下面的空字符串临时修改为策略名即可：DEFAULT_STRATEGY: 'ADXMomentum'
      # ====================================================================================================
      DEFAULT_STRATEGY: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      # [CRITICAL] Cache Data to avoid re-downloading yearly data
      - name: Cache Freqtrade Data
        uses: actions/cache@v3
        with:
          path: user_data/data
          key: ${{ runner.os }}-freqtrade-data-v1-${{ hashFiles('user_data/config.json', 'scripts/download_data.py') }}
          restore-keys: |
            ${{ runner.os }}-freqtrade-data-v1-

      - name: Step 1 - Strategy Registry Classification
        run: python scripts/classify_strategies.py

      - name: Step 2 - Sync/Complete Market Data
        # Using the script with docker logic (via freqtradeorg/freqtrade:latest which is usually preferred on CI)
        # We manually use the image for speed if the runner has it, or pull it
        run: |
          docker pull neozhou2009/freqtrade-full:latest
          python scripts/download_data.py --period ${{ github.event.inputs.period || 'last_1_month' }} --exchange okx --docker

      - name: Step 3 - Prepare Environment (Flatten)
        run: python scripts/prepare_test_env.py

      - name: Step 4 - Run Backtesting
        continue-on-error: true
        run: |
          # 手动触发输入 strategy 优先
          if [ -n "${{ github.event.inputs.strategy }}" ]; then
            STRATEGY="${{ github.event.inputs.strategy }}"
          else
            STRATEGY="${{ env.DEFAULT_STRATEGY }}"
          fi

          if [ -n "$STRATEGY" ]; then
            echo "Running single strategy: $STRATEGY"
            python scripts/run_batch_backtests.py --period ${{ github.event.inputs.period || 'last_1_month' }} --strategy "$STRATEGY" --docker --skip-errors
          else
            echo "Running full batch backtesting"
            python scripts/run_all_batches.py --period ${{ github.event.inputs.period || 'last_1_month' }} --docker --skip-errors
          fi

      - name: Step 5 - Generate Rankings
        run: python scripts/generate_leaderboard.py --period "CI Auto Report - ${{ github.event.inputs.period || 'last_1_month' }}"

      - name: Step 6 - Commit and Push Results
        # Fail only on real git push failure; skip if no changes to commit
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add LEADERBOARD.md leaderboard.json strategy_registry.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: Update Leaderboard [skip ci]"
            git push
          fi
