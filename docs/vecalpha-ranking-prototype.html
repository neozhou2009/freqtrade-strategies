<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VecAlpha | 量化策略雷达</title>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0a0e17;
            --card-bg: #111827;
            --border: #1e293b;
            --text-main: #e4e8f1;
            --text-dim: #94a3b8;
            --text-low: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-main); line-height: 1.5; -webkit-font-smoothing: antialiased; }

        /* Header UI */
        .header { background: linear-gradient(180deg, #111827 0%, #0a0e17 100%); border-bottom: 1px solid var(--border); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px); }
        .header-content { max-width: 1600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.25rem; }
        .logo-v { padding: 4px 10px; background: linear-gradient(135deg, var(--primary), var(--success)); border-radius: 6px; color: white; }
        .nav { display: flex; gap: 1rem; }
        .nav-link { color: var(--text-dim); text-decoration: none; font-size: 0.875rem; padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid transparent; transition: 0.2s; }
        .nav-link.active { color: white; background: #1e293b; border-color: var(--primary); }

        /* Dashboard Layout */
        .main { max-width: 1600px; margin: 2rem auto; padding: 0 2rem; display: grid; grid-template-columns: 280px 1fr; gap: 2rem; }
        .sidebar { position: sticky; top: 100px; height: calc(100vh - 140px); background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; overflow-y: auto; }
        .sidebar h3 { font-size: 0.875rem; color: var(--text-low); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1.5rem; }

        /* Filter Controls */
        .filter-group { margin-bottom: 1.5rem; }
        .filter-label { display: block; font-size: 0.813rem; color: var(--text-dim); margin-bottom: 0.5rem; }
        select, input { width: 100%; background: var(--bg-dark); border: 1px solid #334155; border-radius: 6px; padding: 0.6rem; color: white; font-size: 0.875rem; }
        .range { display: flex; align-items: center; gap: 8px; }
        .checkbox-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.813rem; color: var(--text-dim); cursor: pointer; }
        .btn-apply { background: linear-gradient(135deg, var(--primary), #2563eb); border: none; color: white; padding: 0.75rem; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 600; width: 100%; margin-top: 1rem; }

        /* KPI Cards */
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .kpi-card { background: var(--card-bg); border: 1px solid var(--border); padding: 1.25rem; border-radius: 12px; }
        .kpi-label { font-size: 0.75rem; color: var(--text-low); text-transform: uppercase; margin-bottom: 0.5rem; }
        .kpi-value { font-size: 1.5rem; font-weight: 700; color: white; }
        .kpi-sub { font-size: 0.813rem; color: var(--success); margin-top: 4px; }

        /* Table UI */
        .data-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .table-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .tab-group { display: flex; gap: 8px; }
        .tab-btn { background: transparent; border: 1px solid #334155; color: var(--text-dim); padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 0.875rem; }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

        table { width: 100%; border-collapse: collapse; }
        th { background: var(--bg-dark); color: var(--text-low); font-size: 0.75rem; text-transform: uppercase; padding: 12px 16px; text-align: left; }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        tr:hover td { background: rgba(59, 130, 246, 0.05); }

        .rank-badge { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; background: #1e293b; color: var(--text-dim); }
        .rank-1 { background: var(--warning); color: #000; }
        .rank-2 { background: #94a3b8; color: #000; }
        .rank-3 { background: #b45309; color: #000; }

        .strategy-name { font-weight: 600; color: white; display: block; }
        .strategy-tags { font-size: 0.75rem; color: var(--text-low); margin-top: 2px; }

        .score-box { display: flex; align-items: center; gap: 10px; }
        .p-bar-bg { width: 60px; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
        .p-bar-fill { height: 100%; border-radius: 3px; }

        .m-pos { color: var(--success); }
        .m-neg { color: var(--danger); }
        .badge-trend { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-trend.up { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .btn-detail { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }
        .btn-detail:hover { border-color: var(--primary); color: white; }

        /* Modal Details */
        .modal-wrap { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.3s; }
        .modal-wrap.active { visibility: visible; opacity: 1; }
        .modal { background: var(--card-bg); border-radius: 16px; width: 800px; max-width: 95vw; overflow: hidden; }
        .m-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .m-content { padding: 1.5rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .m-card { background: var(--bg-dark); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); }
        .m-label { font-size: 0.75rem; color: var(--text-low); text-transform: uppercase; margin-bottom: 8px; display: block; }
        .m-val { font-weight: 600; font-size: 1rem; }
    </style>
</head>
<body>

<header class="header">
    <div class="header-content">
        <div class="logo"><span class="logo-v">V</span> VecAlpha Radar</div>
        <nav class="nav">
            <a href="#" class="nav-link">Dashboard</a>
            <a href="#" class="nav-link active">Leaderboard</a>
            <a href="#" class="nav-link">Market</a>
            <a href="#" class="nav-link">Settings</a>
        </nav>
    </div>
</header>

<div class="main">
    <aside class="sidebar">
        <h3>筛选策略</h3>
        <div class="filter-group">
            <label class="filter-label">数据周期</label>
            <select id="periodFilter">
                <option value="last_1_week">近1周 (Weekly)</option>
                <option value="last_1_month" selected>近1月 (Monthly)</option>
                <option value="last_3_months">近3个月 (Quarterly)</option>
                <option value="last_6_months">近半年 (Half Year)</option>
                <option value="last_1_year">近1年 (Yearly)</option>
            </select>
        </div>
        <div class="filter-group">
            <label class="filter-label">评分门槛: <span id="scoreVal">50</span>+</label>
            <input type="range" id="scoreRange" min="0" max="100" value="50">
        </div>
        <div class="filter-group">
            <label class="filter-label">策略风格</label>
            <ul class="checkbox-list">
                <li class="checkbox-item"><input type="checkbox" class="style-check" value="Trend" checked> 趋势跟踪 (Trend)</li>
                <li class="checkbox-item"><input type="checkbox" class="style-check" value="Momentum" checked> 动量引擎 (Momentum)</li>
                <li class="checkbox-item"><input type="checkbox" class="style-check" value="Mean Reversion" checked> 均值回归 (Mean)</li>
                <li class="checkbox-item"><input type="checkbox" class="style-check" value="Scalping" checked> 剥头皮/高频 (Scalping)</li>
                <li class="checkbox-item"><input type="checkbox" class="style-check" value="Breakout" checked> 突破策略 (Breakout)</li>
                <li class="checkbox-item"><input type="checkbox" class="style-check" value="Special" checked> 特殊/实验 (Special)</li>
            </ul>
        </div>
        <button class="btn-apply" id="applyFiltersBtn">应用筛选</button>
    </aside>

    <section class="content">
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">有效策略</div>
                <div class="kpi-value" id="kpi-count">--</div>
                <div class="kpi-sub" id="strat-updated">最新同步</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">全盘平均分</div>
                <div class="kpi-value" id="kpi-avg-score">--</div>
                <div class="kpi-sub">基准线: 60.0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">全盘平均年化</div>
                <div class="kpi-value" id="kpi-avg-cagr">--</div>
                <div class="kpi-sub m-pos">↑ 跑赢大盘</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">平均夏普比率</div>
                <div class="kpi-value" id="kpi-avg-sharpe">--</div>
                <div class="kpi-sub">风险自适应</div>
            </div>
        </div>

        <div class="data-section">
            <div class="table-header">
                <h2 id="period-display">策略排行</h2>
                <div class="tab-group" id="tabs">
                    <button class="tab-btn active" data-type="composite">综合排行</button>
                    <button class="tab-btn" data-type="yield">收益优先</button>
                    <button class="tab-btn" data-type="risk">风险调整</button>
                    <button class="tab-btn" data-type="new">新晋之星</button>
                </div>
            </div>
            <div class="table-container">
                <table id="leaderTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>策略信息</th>
                            <th>评分</th>
                            <th>年化收益</th>
                            <th>夏普比</th>
                            <th>最大回撤</th>
                            <th>趋势</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </section>
</div>

<div class="modal-wrap" id="modal">
    <div class="modal">
        <div class="m-header">
            <h3 id="m-title">策略名称</h3>
            <button style="background:none; border:none; color:white; cursor:pointer; font-size:1.5rem" onclick="toggleModal()">&times;</button>
        </div>
        <div class="m-content" id="m-body"></div>
    </div>
</div>

<script>
    let DATA = { leaderboard: [], summary: {} };
    let currentDisplayData = [];

    // 核心初始化：从本地文件异步加载
    async function init() {
        const period = document.getElementById('periodFilter').value;
        await loadPeriodData(period);
        
        // 初始渲染
        applyFilters();
    }

    async function loadPeriodData(period) {
        console.log(`[Network] Loading real data for: ${period}`);
        try {
            // 拼接服务器相对路径
            const response = await fetch(`../user_data/leaderboard/leaderboard_${period}.json`);
            if (!response.ok) throw new Error("File not found");
            DATA = await response.json();
            
            // 更新汇总 KPI
            document.getElementById('kpi-count').innerText = DATA.strat_count;
            document.getElementById('kpi-avg-score').innerText = DATA.summary.avg_score;
            document.getElementById('kpi-avg-cagr').innerText = (DATA.summary.avg_cagr * 100).toFixed(1) + '%';
            document.getElementById('kpi-avg-sharpe').innerText = DATA.summary.avg_sharpe;
            document.getElementById('period-display').innerText = `策略英雄榜 (${DATA.period})`;
            document.getElementById('strat-updated').innerText = `同步于: ${new Date(DATA.generated_at).toLocaleTimeString()}`;
            
            return true;
        } catch (e) {
            console.error("[Error] Failed to load data:", e);
            document.querySelector('#leaderTable tbody').innerHTML = `<tr><td colspan="8" style="text-align:center; padding:50px; color:var(--danger)">无法加载或未找到周期文件: leaderboard_${period}.json<br><small>请确保已运行 python scripts/generate_leaderboard.py --period ${period}</small></td></tr>`;
            return false;
        }
    }

    function render(data) {
        const tbody = document.querySelector('#leaderTable tbody');
        tbody.innerHTML = '';
        
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:50px; color:var(--text-low)">未找到符合条件的策略</td></tr>';
            return;
        }

        data.forEach((s, idx) => {
            const tr = document.createElement('tr');
            const scoreColor = s.composite_score > 80 ? 'var(--success)' : (s.composite_score > 60 ? 'var(--warning)' : 'var(--danger)');
            const rankClass = idx === 0 ? 'rank-1' : (idx === 1 ? 'rank-2' : (idx === 2 ? 'rank-3' : ''));
            const trendIcon = s.rank_delta > 0 ? '↑' : (s.rank_delta < 0 ? '↓' : '-');
            const trendClass = s.rank_delta > 0 ? 'up' : (s.rank_delta < 0 ? 'down' : '');

            tr.innerHTML = `
                <td><div class="rank-badge ${rankClass}">${idx + 1}</div></td>
                <td>
                    <span class="strategy-name">${s.strategy}</span>
                    <span class="strategy-tags">${(s.styles || []).join(' · ')}</span>
                </td>
                <td>
                    <div class="score-box">
                        <div class="p-bar-bg"><div class="p-bar-fill" style="width:${s.composite_score}%; background:${scoreColor}"></div></div>
                        <span style="font-weight:700; color:${scoreColor}">${s.composite_score}</span>
                    </div>
                </td>
                <td class="${s.cagr >= 0 ? 'm-pos' : 'm-neg'} font-bold">${(s.cagr * 100).toFixed(1)}%</td>
                <td>${s.sharpe.toFixed(2)}</td>
                <td class="m-neg">-${(s.max_drawdown_pct * 100).toFixed(1)}%</td>
                <td><span class="badge-trend ${trendClass}">${trendIcon} ${Math.abs(s.rank_delta) || ''}</span></td>
                <td><button class="btn-detail" onclick="viewDetailsByIndex(${idx})">详情</button></td>
            `;
            tbody.appendChild(tr);
        });
        currentDisplayData = data;
    }

    function applyFilters() {
        const minScore = parseInt(document.getElementById('scoreRange').value);
        const selectedStyles = Array.from(document.querySelectorAll('.style-check:checked')).map(cb => cb.value);

        if (!DATA.leaderboard) return;

        let filtered = DATA.leaderboard.filter(s => {
            if (s.composite_score < minScore) return false;
            const hasStyle = (s.styles || []).some(style => selectedStyles.includes(style)) || selectedStyles.includes(s.category);
            return hasStyle;
        });

        const activeTab = document.querySelector('.tab-btn.active').dataset.type;
        sortData(filtered, activeTab);
    }

    function sortData(list, type) {
        if(type === 'composite') list.sort((a,b) => b.composite_score - a.composite_score);
        if(type === 'yield') list.sort((a,b) => b.cagr - a.cagr);
        if(type === 'risk') list.sort((a,b) => b.sharpe - a.sharpe);
        if(type === 'new') list.sort((a,b) => new Date(b.added_date) - new Date(a.added_date));
        render(list);
    }

    document.getElementById('applyFiltersBtn').onclick = applyFilters;

    document.getElementById('scoreRange').oninput = function() {
        document.getElementById('scoreVal').innerText = this.value;
    };

    // 周期切换监听
    document.getElementById('periodFilter').onchange = async function() {
        const success = await loadPeriodData(this.value);
        if (success) applyFilters();
    };

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelector('.tab-btn.active').classList.remove('active');
            btn.classList.add('active');
            sortData(currentDisplayData, btn.dataset.type);
        }
    });

    function viewDetailsByIndex(index) {
        const s = currentDisplayData[index];
        document.getElementById('m-title').innerText = s.strategy;
        const body = document.getElementById('m-body');
        body.innerHTML = `
            <div class="m-card"><span class="m-label">入库日期</span><span class="m-val">${s.added_date || '2026-01-01'}</span></div>
            <div class="m-card"><span class="m-label">核心家族</span><span class="m-val">${s.family}</span></div>
            <div class="m-card"><span class="m-label">胜率</span><span class="m-val m-pos">${(s.winrate*100).toFixed(1)}%</span></div>
            <div class="m-card"><span class="m-label">总交易次数</span><span class="m-val">${s.trades}</span></div>
            <div class="m-card"><span class="m-label">获利因子 (PF)</span><span class="m-val">${s.profit_factor.toFixed(2)}</span></div>
            <div class="m-card"><span class="m-label">Calmar Ratio</span><span class="m-val">${s.calmar.toFixed(2)}</span></div>
        `;
        toggleModal();
    }

    function toggleModal() {
        document.getElementById('modal').classList.toggle('active');
    }

    init();
</script>

</body>
</html>
